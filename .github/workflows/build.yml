name: Build Desktop App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set version
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Inject settings
        env:
          GH_REPO: ${{ github.repository }}
          BUILD_NO: ${{ github.run_number }}
          SITE_URL: ${{ vars.SITE_URL }}
          WEB_CLIENT_ID: ${{ vars.WEB_CLIENT_ID }}
        run: node scripts/inject-settings.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never

      - name: Collect files
        run: |
          mkdir -p out
          cd dist
          for f in *.exe *.dmg *.zip *.AppImage *.deb *.blockmap latest*.yml; do
            [ -f "$f" ] && cp "$f" "$GITHUB_WORKSPACE/out/" || true
          done
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload build files
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v5

      - name: Download all build files
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: release_files

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: 1.0.${{ github.run_number }}
        run: |
          ls -la release_files
          git log -1 --pretty=%B > notes.txt || echo "Khaled Ahmed $V" > notes.txt
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" release_files/* --clobber
          else
            gh release create "v$V" release_files/* --title "Khaled Ahmed $V" --notes-file notes.txt --latest
          fi
